default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  password: su
  host: localhost
  pool: 5

development:
  <<: *default
  database: planeterium_app_development

test:
  <<: *default
  database: planeterium_app_test

production:
  <<: *default
  database: planeterium_app_production
  username: planeterium
  password: <%= ENV["PAYROLL_APP_DATABASE_PASSWORD"] %>
